# .github/workflows/deploy.yml
name: Deploy to DigitalOcean

on:
  push:
    branches:
      - test-ci # Or the branch you want to deploy from

jobs:
  deploy:
    runs-on: ubuntu-latest # Use GitHub hosted runner temporarily for testing

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js (example - replace with your project's needs)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies (example)
      run: |
        npm install

    - name: Test Docker build (GitHub hosted runner)
      run: |
           echo "Testing Docker compose configuration..."
           docker compose config
           echo "Docker compose file is valid!"
           
    - name: Build Docker images (test only)
      run: |
           echo "Building Docker images for testing..."
           docker compose build
           echo "Build successful!" 